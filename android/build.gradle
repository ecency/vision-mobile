
import groovy.json.JsonSlurper

def getNpmVersion() {
    def inputFile = new File(projectDir.getPath() + "/../package.json")
    def packageJson = new JsonSlurper().parseText(inputFile.text)
    return packageJson["version"]
}

def getNpmVersionArray() { // major [0], minor [1], patch [2]
    def (major, minor, patch) = getNpmVersion().tokenize('.')
    return [Integer.parseInt(major), Integer.parseInt(minor), Integer.parseInt(patch)] as int[]
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "28.1.13356709"
        // expo-iap pulls openiap-google, built with Kotlin 2.2, and the Kotlin
        // compiler refuses metadata newer than its own -- 2.0.21 fails
        // :expo:compileReleaseKotlin. Newer compilers read older metadata fine.
        kotlinVersion = "2.2.0"
        googlePlayServicesVisionVersion = "17.0.2"
        googlePlayServicesVersion = "16.+"
        firebaseVersion = "17.3.4"
        okhttp = "4.12.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pinned above the version React Native 0.79 resolves (8.8.2), which caps
        // compileSdk at 35. compileSdk 36 needs AGP 8.9.1+.
        // R8 bundled with AGP 8.9 cannot read Kotlin 2.2 metadata (kotlinVersion
        // above); 8.10.21+ is the first R8 that supports it. Must precede AGP.
        classpath("com.android.tools:r8:8.10.24")
        classpath("com.android.tools.build:gradle:8.9.2")
        classpath 'com.google.gms:google-services:4.4.3'
        // Only used to upload the R8 mapping file, see the sentry block in app/build.gradle.
        classpath("io.sentry:sentry-android-gradle-plugin:5.12.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Unversioned, this resolves to 2.0.21 from React Native's version
        // catalog, which is the compiler that fails on openiap's 2.2 metadata.
        // The kotlinVersion ext above only changes what libraries declare.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0")
    }
}

subprojects {project ->
    ext {
        def npmVersion = getNpmVersionArray()
        versionMajor = npmVersion[0]
        versionMinor = npmVersion[1]
        versionPatch = npmVersion[2]
    }
}


apply plugin: "com.facebook.react.rootproject"