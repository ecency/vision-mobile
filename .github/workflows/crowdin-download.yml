name: Crowdin Download

# Pulls the latest translations from Crowdin on demand and batches them into a
# single pull request, instead of Crowdin auto-pushing one commit per language.
#
# Triggers:
#   - add the "sync-translations" label to any same-repo PR (auto-removed after
#     the run, so re-adding it triggers a fresh pull), or
#   - run manually from the Actions tab (workflow_dispatch).
# Fork PRs are skipped — they have no access to the Crowdin secret.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  download:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'sync-translations' &&
       github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development

      - name: Remove trigger label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'sync-translations',
            });

      - name: Download translations from Crowdin
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2.17.1
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          # Strings live under a Crowdin branch (created by the old GitHub
          # integration); without this the CLI can't match files to crowdin.yml.
          crowdin_branch_name: development
          # Use the development checkout above as the base for l10n/crowdin.
          # Without this the action checks out the trigger PR's head ref, which
          # fails (or bases the translations PR on unrelated feature changes).
          skip_ref_checkout: true
          localization_branch_name: l10n/crowdin
          create_pull_request: true
          pull_request_title: 'chore(i18n): sync translations from Crowdin'
          pull_request_body: 'Batched translation update pulled from Crowdin.'
          pull_request_base_branch_name: development
          commit_message: 'chore(i18n): sync translations from Crowdin'
          github_user_name: 'github-actions[bot]'
          github_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: "340925"
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Crowdin cannot hold a translation without plural forms for a plural source, so a native.plurals key seeded
      # from RN's text comes back as English after every download. The seed script restores it on the same branch
      # (README "Crowdin", seeded translations); nothing is pushed when it changes nothing. A fresh clone: the
      # Crowdin action runs in a container, so the workspace files it wrote may not be writable here.
      - name: Reseed native plurals
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git -c http.extraheader="$auth" ls-remote --exit-code "$repo" refs/heads/l10n/crowdin >/dev/null; then
            echo "no l10n/crowdin branch"; exit 0
          fi
          dir="$RUNNER_TEMP/reseed"
          git -c http.extraheader="$auth" clone -q --depth 1 --branch l10n/crowdin "$repo" "$dir"
          cd "$dir"
          node tools/l10n/seed-native-plurals.mjs
          if git diff --quiet -- src/config/locales; then echo "nothing to reseed"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'chore(i18n): reseed native plurals Crowdin cannot hold yet' -- src/config/locales
          git -c http.extraheader="$auth" push -q origin l10n/crowdin
