name: Lint & Test

# Pull request checks on Linux: the shared core's and the Android app's unit tests, the build-logic tests and Android
# lint (no app build, no device). iOS targets need macOS; the release workflow and local runs cover them (README.md
# "Release pipeline"). A pull request that changes only docs skips them.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: App changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE" ]] || ! git diff --quiet "$BASE...HEAD" -- . ':!*.md' ':!docs' ':!.claude' ':!.github/ISSUE_TEMPLATE' ':!LICENSE'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed: nothing to test."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.app == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: native-android-gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: native-android-gradle-

      - name: Unit tests and lint
        if: steps.changes.outputs.app == 'true'
        run: ./gradlew --no-daemon :build-logic:test :shared:testAndroidHostTest :androidApp:testDebugUnitTest :androidApp:lintDebug

      # The release APK script against a local fake of Google (no network, no secret): seconds
      - name: Release APK script
        if: steps.changes.outputs.app == 'true'
        run: scripts/release-apk-test.sh
