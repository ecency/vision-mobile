version: 2

# Monthly, grouped, at most 3 open pull requests per ecosystem to keep CI minutes low (security updates still come
# as soon as an advisory lands, whatever the schedule).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      gradle:
        patterns: ["*"]

  # Offline golden fixture generators only; never part of a build.
  - package-ecosystem: npm
    directories:
      - /tools
      - /tools/render
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      tools:
        patterns: ["*"]
    ignore:
      # tools/render pins htmlparser2 to the version @ecency/render-helper bundles (its fixture scripts parse and
      # decode entities as render-helper does); it moves only together with render-helper, by hand.
      - dependency-name: htmlparser2

  # swift: not configured. Dependabot reads Package.swift or a committed Xcode project; the iOS project here is
  # generated from iosApp/project.yml (XcodeGen) and is not committed, so there is nothing for it to update.
