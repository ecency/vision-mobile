// Shared-core types the Compose UI receives. They are immutable (vals of immutable data, read-only
// lists that are never mutated after construction), but they come from a module the Compose compiler
// does not see, so without this list every card and comment would recompose whenever its parent did.
com.ecency.core.app.PostCard
com.ecency.core.app.CommentItem
com.ecency.core.app.FeedState
com.ecency.core.app.PostState
com.ecency.core.app.VoteState
com.ecency.core.app.VoteStatus
com.ecency.core.app.ReplyState
com.ecency.core.app.AppError
com.ecency.core.api.model.*
com.ecency.core.render.blocks.*
